<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drive: Live Speed &amp; Trip</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Live speed, distance, heading and trip stats from your phone's GPS.">
<meta name="theme-color" content="#05070d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drive">
<style>
:root{--bg1:#eef2f9;--bg2:#dde5f4;--glass:rgba(255,255,255,.55);--sheet:rgba(248,249,252,.86);--stroke:rgba(255,255,255,.75);--text:#1d1d1f;--sub:#6e6e73;--accent:#0a84ff;--ok:#30d158;--warn:#ff9f0a;--bad:#ff453a;--track:rgba(0,0,0,.08);--segon:#fff;--shadow:0 10px 40px rgba(40,60,110,.14);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#05070d;--bg2:#0c1322;--glass:rgba(255,255,255,.07);--sheet:rgba(30,32,40,.82);--stroke:rgba(255,255,255,.14);--text:#f5f5f7;--sub:#9a9aa2;--track:rgba(255,255,255,.1);--segon:rgba(255,255,255,.18);--shadow:0 10px 40px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg1:#05070d;--bg2:#0c1322;--glass:rgba(255,255,255,.07);--sheet:rgba(30,32,40,.82);--stroke:rgba(255,255,255,.14);--text:#f5f5f7;--sub:#9a9aa2;--track:rgba(255,255,255,.1);--segon:rgba(255,255,255,.18);--shadow:0 10px 40px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:radial-gradient(60% 45% at 12% 0%,rgba(10,132,255,.32),transparent),radial-gradient(50% 40% at 100% 18%,rgba(191,90,242,.22),transparent),linear-gradient(var(--bg1),var(--bg2));background-attachment:fixed;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:5;background:var(--bg1);opacity:.6;backdrop-filter:blur(20px)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;padding:16px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:20px;letter-spacing:-.02em}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:grid;place-items:center}
.hr{display:flex;align-items:center;gap:10px}
.pill{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:99px;font-size:14px;font-weight:500;color:var(--sub)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.pill.on{color:var(--text)}.pill.on i{background:var(--ok);box-shadow:0 0 0 4px rgba(48,209,88,.25)}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0}
.glass{background:var(--glass);border:1px solid var(--stroke);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.25)}
.layout{display:grid;gap:16px}
.hero{border-radius:32px;padding:26px 20px 22px;text-align:center}
.gauge{position:relative;width:min(78vw,330px);aspect-ratio:1;margin:0 auto}
.gauge svg{width:100%;height:100%;display:block}
.gauge circle{fill:none;stroke-width:14;stroke-linecap:round}
.trk{stroke:var(--track);stroke-dasharray:424.1 600}
#arc{stroke:url(#gr);stroke-dasharray:0 600}
.hero.over #arc{stroke:var(--bad)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:6%}
#num{font-size:clamp(76px,22vw,112px);font-weight:600;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.hero.over #num{color:var(--bad)}
#unit{font-size:18px;color:var(--sub);font-weight:500;margin-top:4px}
#lim{font-size:13px;color:var(--bad);font-weight:600;height:18px;margin-top:6px}
.btn{width:100%;height:58px;border:0;border-radius:29px;font-size:18px;font-weight:600;color:#fff;background:linear-gradient(135deg,#0a84ff,#5e5ce6);box-shadow:0 8px 24px rgba(10,132,255,.38);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.stop{background:rgba(255,69,58,.15);color:var(--bad);box-shadow:none}
.row2{display:flex;justify-content:center;gap:22px;margin-top:14px}
.link{background:none;border:0;color:var(--accent);font-size:15px;font-weight:500;padding:6px}
#hint{margin:10px auto 0;max-width:34ch;font-size:14px;color:var(--sub);min-height:40px}
#hint.bad{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:2px;min-height:104px;position:relative}
.lb{font-size:14px;color:var(--sub);font-weight:500}
.tile b{font-size:32px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;margin-top:auto}
.tile small{font-size:14px;color:var(--sub);min-height:19px}
.dot{position:absolute;top:18px;right:16px;width:10px;height:10px;border-radius:50%;background:var(--sub)}
.compass{position:absolute;top:12px;right:12px;width:34px;height:34px}
.chart{border-radius:24px;padding:16px 16px 10px;grid-column:1/-1}
.chart svg{width:100%;height:84px;display:block;margin-top:8px}
#ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;vector-effect:non-scaling-stroke}
#fl{fill:url(#cg);stroke:none}
dialog{border:0;padding:0;background:transparent;color:var(--text);width:100%;max-width:460px;margin:auto auto 0}
dialog::backdrop{background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.sheet{border-radius:30px 30px 0 0;padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));background:var(--sheet);border:1px solid var(--stroke);backdrop-filter:blur(40px) saturate(180%);-webkit-backdrop-filter:blur(40px) saturate(180%)}
.sheet h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em;display:flex;justify-content:space-between;align-items:center}
.set{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--track)}
.set:last-of-type{border:0}
.set span small{display:block;color:var(--sub);font-size:13px}
.seg{display:flex;background:var(--track);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:8px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--segon);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.15)}
input[type=range]{width:100%;accent-color:var(--accent)}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--track);position:relative;transition:.2s;flex:none;margin:0}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:.2s}
.sw:checked{background:var(--ok)}.sw:checked::after{transform:translateX(20px)}
@media (min-width:860px){
.layout{grid-template-columns:400px 1fr;align-items:start;gap:20px}
.hero{position:sticky;top:20px}
dialog{margin:auto}.sheet{border-radius:30px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="brand"><div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 17a8 8 0 1 1 16 0"/><path d="M12 17l4-5"/></svg></div>Drive</div>
 <div class="hr">
  <div class="pill glass" id="pill"><i></i><span id="pt">Ready</span></div>
  <button class="icon glass" id="gear" aria-label="Open settings"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg></button>
 </div>
</header>
<main class="layout">
 <section class="hero glass" id="hero" aria-label="Current speed">
  <div class="gauge">
   <svg viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="gr" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0a84ff"/><stop offset="1" stop-color="#bf5af2"/></linearGradient></defs>
   <circle class="trk" cx="120" cy="120" r="90" transform="rotate(135 120 120)"/><circle id="arc" cx="120" cy="120" r="90" transform="rotate(135 120 120)"/></svg>
   <div class="center"><div id="num">0</div><div id="unit">km/h</div><div id="lim"></div></div>
  </div>
  <button class="btn" id="go">Start trip</button>
  <div class="row2"><button class="link" id="reset">Reset trip</button><button class="link" id="demo">Try demo</button></div>
  <p id="hint" aria-live="polite">Tap Start trip and allow location access. Keep this screen open while you drive.</p>
 </section>
 <section class="tiles" id="tiles"></section>
</main>
</div>
<dialog id="dlg"><div class="sheet">
 <h2>Settings <button class="link" id="done">Done</button></h2>
 <div class="set"><span>Units</span><div class="seg" data-k="unit"><button data-v="kmh">km/h</button><button data-v="mph">mph</button></div></div>
 <div class="set"><span>Appearance</span><div class="seg" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
 <div class="set" style="flex-direction:column;align-items:stretch;gap:8px"><span>Speed alert <b id="lv" style="float:right;font-weight:600"></b><small>Turns the display red above this speed.</small></span><input type="range" id="lr" min="0" max="200" step="5" aria-label="Speed alert"></div>
 <div class="set"><span>Keep screen on<small>Prevents sleep while tracking.</small></span><input type="checkbox" class="sw" id="aw" aria-label="Keep screen on"></div>
 <div class="set"><span>Install app<small>On iPhone: tap Share, then Add to Home Screen.</small></span><button class="link" id="inst" hidden>Install</button></div>
</div></dialog>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const S={unit:'kmh',limit:0,theme:'auto',awake:true};
try{Object.assign(S,JSON.parse(localStorage.getItem('drive-settings')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('drive-settings',JSON.stringify(S))}catch(e){}};
const mi=()=>S.unit==='mph',spd=v=>v*(mi()?2.23694:3.6),dst=m=>m/(mi()?1609.344:1000),alt=m=>m*(mi()?3.28084:1);
const T0=()=>({run:false,el:0,dist:0,max:0,mov:0,last:null,hist:[],alt:null,hd:null,acc:null});
let T=T0(),shown=0,target=0,watch=null,demo=null,tick=null,lock=null,ip=null;
const C=424.1,hms=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=Math.floor(s%60);return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const hav=(a,b,c,d)=>{const r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,h=Math.sin(x/2)**2+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)**2;return 12742e3*Math.asin(Math.sqrt(h))};
const tiles=[['dist','Distance'],['time','Trip time'],['avg','Average speed'],['max','Top speed'],['alt','Altitude'],['mov','Moving time'],['sig','GPS signal'],['hd','Heading']];
$('#tiles').innerHTML=tiles.map(([k,l])=>`<div class="tile glass"><span class="lb">${l}</span>${k==='sig'?'<i class="dot" id="dot"></i>':''}${k==='hd'?'<svg class="compass" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="none" stroke="var(--track)" stroke-width="2"/><g id="nd" style="transition:transform .5s;transform-origin:20px 20px"><path d="M20 5l5 15h-10z" fill="var(--bad)"/><path d="M20 35l5-15h-10z" fill="var(--sub)" opacity=".5"/></g></svg>':''}<b id="v-${k}">0</b><small id="u-${k}"></small></div>`).join('')+
`<div class="tile chart glass"><span class="lb">Recent speed</span><svg viewBox="0 0 300 80" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".35"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs><path id="fl"/><path id="ln"/></svg></div>`;
const set=(k,v,u)=>{$('#v-'+k).textContent=v;$('#u-'+k).textContent=u||''};
function paint(){
 const u=mi()?'mph':'km/h';
 set('dist',dst(T.dist).toFixed(2),mi()?'miles':'kilometres');
 set('time',hms(T.el));
 set('avg',Math.round(spd(T.mov>0?T.dist/T.mov:0)),u);
 set('max',Math.round(spd(T.max)),u);
 set('alt',T.alt==null?'—':Math.round(alt(T.alt)),mi()?'feet':'metres');
 set('mov',hms(T.mov));
 const a=T.acc,q=a==null?['No signal','var(--sub)']:a<=10?['Excellent','var(--ok)']:a<=25?['Good','var(--ok)']:a<=60?['Fair','var(--warn)']:['Weak','var(--bad)'];
 set('sig',q[0],a==null?'':'±'+Math.round(a)+' m');$('#dot').style.background=q[1];
 const h=T.hd;set('hd',h==null?'—':['N','NE','E','SE','S','SW','W','NW'][Math.round(h/45)%8],h==null?'':Math.round(h)+'°');
 if(h!=null)$('#nd').style.transform='rotate('+h+'deg)';
 $('#unit').textContent=u;
 const hs=T.hist;if(hs.length<2){$('#ln').setAttribute('d','');$('#fl').setAttribute('d','')}else{const mx=Math.max(...hs,5),n=hs.length-1,d='M'+hs.map((v,i)=>(i/n*300).toFixed(1)+' '+(76-v/mx*70).toFixed(1)).join('L');$('#ln').setAttribute('d',d);$('#fl').setAttribute('d',d+'L300 80L0 80Z')}
}
function loop(){
 shown+=(target-shown)*.12;if(Math.abs(target-shown)<.01)shown=target;
 const v=spd(shown),mx=Math.max(mi()?120:200,Math.ceil(spd(T.max)/20)*20);
 $('#arc').style.strokeDasharray=Math.max(.01,C*Math.min(v/mx,1))+' 600';
 $('#num').textContent=Math.round(v);
 const over=S.limit>0&&target*3.6>S.limit;
 $('#hero').classList.toggle('over',over);$('#lim').textContent=over?'Over your speed alert':'';
 requestAnimationFrame(loop);
}
function onPos(p){
 const c=p.coords,t=p.timestamp,L=T.last,dt=L?(t-L.t)/1000:0;
 T.acc=c.accuracy;
 if(c.accuracy>80){paint();return}
 const d=L&&dt>0?hav(L.lat,L.lon,c.latitude,c.longitude):0;
 let v=c.speed;if(v==null||isNaN(v))v=L&&dt>0&&dt<10?d/dt:0;
 if(v<.8)v=0;
 T.last={lat:c.latitude,lon:c.longitude,t};
 if(v>0&&L&&dt<15){T.dist+=d;T.mov+=dt}
 T.max=Math.max(T.max,v);target=v;
 if(c.altitude!=null)T.alt=c.altitude;
 if(c.heading!=null&&!isNaN(c.heading)&&v>1)T.hd=c.heading;
 T.hist.push(v);if(T.hist.length>120)T.hist.shift();
 if(S.limit>0&&v*3.6>S.limit&&navigator.vibrate)try{navigator.vibrate(120)}catch(e){}
 msg('');paint();
}
function msg(t,bad){const h=$('#hint');h.textContent=t;h.className=bad?'bad':''}
function ui(){
 $('#go').textContent=T.run?'Pause trip':T.el>0?'Resume trip':'Start trip';
 $('#go').classList.toggle('stop',T.run);
 $('#pill').classList.toggle('on',T.run);$('#pt').textContent=T.run?'Tracking':'Ready';
}
function begin(){tick=setInterval(()=>{T.el++;paint()},1000);wake()}
function start(){
 if(T.run)return stop();
 if(!navigator.geolocation){msg('This browser can’t read your location. Try Safari, Chrome or Edge.',1);return}
 T.run=true;ui();msg('Finding GPS signal. This can take a few seconds.');
 watch=navigator.geolocation.watchPosition(onPos,err,{enableHighAccuracy:true,maximumAge:0,timeout:20000});begin();
}
function stop(note){
 if(watch!=null)navigator.geolocation.clearWatch(watch);watch=null;
 clearInterval(demo);demo=null;clearInterval(tick);T.run=false;T.last=null;target=0;
 try{lock&&lock.release()}catch(e){}lock=null;ui();paint();
 msg(note===0?'':'Trip paused. Tap Resume trip to continue.');
}
function err(e){
 const m={1:'Location is blocked. Allow location for this site in your browser settings, then tap Start trip.',2:'No GPS signal. Move to an open area and try again.',3:'GPS is taking too long. Make sure location services are on.'};
 if(e.code===1)stop(0);msg(m[e.code]||'Location isn’t working right now.',1);
}
function startDemo(){
 if(T.run)stop(0);T.run=true;ui();msg('Demo mode: a simulated drive. No GPS is used.');
 let lat=21.5,lon=70.45,h=40,k=0;
 const step=()=>{k++;const v=15+9*Math.sin(k/9)+4*Math.sin(k/3.1);h=(h+2*Math.sin(k/13)+360)%360;lat+=v*Math.cos(h*Math.PI/180)/111320;lon+=v*Math.sin(h*Math.PI/180)/(111320*Math.cos(lat*Math.PI/180));onPos({timestamp:Date.now(),coords:{speed:v,heading:h,altitude:80+k%15,accuracy:6,latitude:lat,longitude:lon}});msg('Demo mode: a simulated drive. No GPS is used.')};
 step();demo=setInterval(step,1000);begin();
}
async function wake(){try{if(S.awake&&T.run&&'wakeLock'in navigator)lock=await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)wake()});
$('#go').onclick=start;$('#demo').onclick=startDemo;
$('#reset').onclick=()=>{stop(0);T=T0();shown=0;ui();paint();msg('Trip cleared. Ready when you are.')};
function sync(){
 if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.theme;
 $$('.seg').forEach(s=>[...s.children].forEach(b=>b.setAttribute('aria-pressed',S[s.dataset.k]===b.dataset.v)));
 const f=mi()?.621371:1;$('#lr').max=mi()?125:200;$('#lr').value=Math.round(S.limit*f/5)*5;
 $('#lv').textContent=S.limit>0?Math.round(S.limit*f/5)*5+' '+(mi()?'mph':'km/h'):'Off';
 $('#aw').checked=S.awake;paint();
}
$$('.seg').forEach(s=>s.onclick=e=>{const b=e.target.closest('button');if(!b)return;S[s.dataset.k]=b.dataset.v;save();sync()});
$('#lr').oninput=e=>{S.limit=+e.target.value/(mi()?.621371:1);save();sync()};
$('#aw').onchange=e=>{S.awake=e.target.checked;save();if(S.awake)wake();else{try{lock&&lock.release()}catch(x){}}};
$('#gear').onclick=()=>$('#dlg').showModal();$('#done').onclick=()=>$('#dlg').close();
$('#dlg').onclick=e=>{if(e.target.id==='dlg')e.target.close()};
addEventListener('beforeinstallprompt',e=>{e.preventDefault();ip=e;$('#inst').hidden=false});
$('#inst').onclick=()=>{if(ip){ip.prompt();ip=null;$('#inst').hidden=true}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
sync();ui();loop();
</script>
</body>
</html>
